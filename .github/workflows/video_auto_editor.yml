name: Scrape item-post videos, remove old credits, upload reels to Mega.nz
on:
  workflow_dispatch:
    inputs:
      page_url:
        description: |
          One or more page URLs to scrape (.item-post video elements).
          Put each URL on its own line, OR separate them with commas.
          Example:
          https://site.com/page1
          https://site.com/page2
        required: true
        type: string
      base_site:
        description: "Base site URL, used to resolve site-relative video paths (e.g. https://example.com)"
        required: false
        default: ""
        type: string
      mega_folder_name:
        description: "Mega.nz folder path to save PROCESSED reels into (raw scraped videos are never uploaded)"
        required: true
        type: string
      max_idle_scrolls:
        description: "Stop after this many scrolls with no new videos (per page)"
        required: false
        default: "8"
        type: string
      max_videos:
        description: "Optional: max total videos across ALL urls (leave blank = no limit)"
        required: false
        default: ""
        type: string
      clip_seconds:
        description: "Length (seconds) of each output reel part"
        required: false
        default: "60"
        type: string
      watermark_mode:
        description: "auto (detect credit/logo), manual (opens a picker -- not usable in CI), or none"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - none
      watermark_box:
        description: "Optional: skip detection, fixed pixel box 'x,y,w,h' used on EVERY video (only safe if all source videos share one resolution)"
        required: false
        default: ""
        type: string
      watermark_box_pct:
        description: "Optional: skip detection, box as fractions of frame 'x,y,w,h' (0-1), rescaled per video -- best for mixed-resolution scraped videos"
        required: false
        default: ""
        type: string
      shared_watermark_from_first:
        description: "If auto-detecting and no fixed box given: detect once on first video, reuse for the rest of the batch"
        required: false
        default: true
        type: boolean
      intro_sec:
        description: "Optional: force intro length (seconds) instead of auto-detecting"
        required: false
        default: ""
        type: string
      outro_sec:
        description: "Optional: force outro START timestamp (seconds) instead of auto-detecting"
        required: false
        default: ""
        type: string
      no_outro_detect:
        description: "Disable outro detection entirely (only intro is trimmed)"
        required: false
        default: false
        type: boolean
      keep_remainder:
        description: "Keep a final short leftover reel part if usable content doesn't divide evenly"
        required: false
        default: false
        type: boolean
      debug_preview:
        description: "Save a red-box preview PNG per video (uploaded as a workflow artifact) -- useful the first time you run a new source"
        required: false
        default: false
        type: boolean
      spreadsheet_id:
        description: "(optional) Google Sheet ID to log Source Video + Processed Reel File + Caption into"
        required: false
        default: "1OQns3xUPeTQslsw0FaD-a85DAM0Sc_L6BnaGDMqGPmY"
        type: string
      sheet_tab:
        description: "(optional) Force a specific tab name — leave blank to use the Mega folder name"
        required: false
        default: ""
        type: string
      download_concurrency:
        description: "How many videos to download in parallel (lower than images -- files are much bigger)"
        required: false
        default: "4"
        type: string
      upload_transfers:
        description: "How many processed reel files rclone uploads to Mega in parallel"
        required: false
        default: "4"
        type: string
jobs:
  scrape-process-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Install ffmpeg (video processing) and OpenCV system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1
          ffmpeg -version

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Write rclone config file
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: printf '%s' "$RCLONE_CONF" > rclone.conf

      - name: Write Google credentials file
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: printf '%s' "$GOOGLE_CREDENTIALS_JSON" > google_creds.json

      - name: Run scrape + local credit-removal + Mega upload
        env:
          PAGE_URL: ${{ inputs.page_url }}
          BASE_SITE: ${{ inputs.base_site }}
          MEGA_FOLDER_NAME: ${{ inputs.mega_folder_name }}
          MAX_IDLE_SCROLLS: ${{ inputs.max_idle_scrolls }}
          MAX_VIDEOS: ${{ inputs.max_videos }}
          CLIP_SECONDS: ${{ inputs.clip_seconds }}
          WATERMARK_MODE: ${{ inputs.watermark_mode }}
          WATERMARK_BOX: ${{ inputs.watermark_box }}
          WATERMARK_BOX_PCT: ${{ inputs.watermark_box_pct }}
          SHARED_WATERMARK_FROM_FIRST: ${{ inputs.shared_watermark_from_first }}
          INTRO_SEC: ${{ inputs.intro_sec }}
          OUTRO_SEC: ${{ inputs.outro_sec }}
          NO_OUTRO_DETECT: ${{ inputs.no_outro_detect }}
          KEEP_REMAINDER: ${{ inputs.keep_remainder }}
          DEBUG_PREVIEW: ${{ inputs.debug_preview }}
          SPREADSHEET_ID: ${{ inputs.spreadsheet_id }}
          SHEET_TAB: ${{ inputs.sheet_tab }}
          DOWNLOAD_CONCURRENCY: ${{ inputs.download_concurrency }}
          UPLOAD_TRANSFERS: ${{ inputs.upload_transfers }}
          RCLONE_CONFIG_PATH: rclone.conf
          RCLONE_REMOTE_NAME: mega
          GOOGLE_APPLICATION_CREDENTIALS: google_creds.json
          PYTHONUNBUFFERED: "1"
        run: python -u scrape_and_process_videos.py

      - name: Clean up credentials files
        if: always()
        run: rm -f google_creds.json rclone.conf

      - name: Upload debug preview PNGs as artifact (only if --debug-preview was used)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watermark-debug-previews
          path: processed_reels/*_wm_preview.png
          if-no-files-found: ignore
